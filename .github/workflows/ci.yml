name: CI

# Draft PRs stay quiet during active development. Validation becomes automatic
# as soon as a PR is ready for review, and remains available manually at any time.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    name: Validate
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +stable fmt --check

      - name: Run Clippy
        run: cargo +stable clippy --all-targets --locked -- -D warnings

      - name: Reject production panics and unchecked assumptions
        run: cargo +stable clippy --bin moondesk --locked -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::unreachable

      - name: Run tests
        run: cargo +stable test --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify npm wrapper, installer, and package contents
        shell: bash
        run: |
          set -euo pipefail
          node --check .github/scripts/npm-oidc-preflight.mjs
          node --check .github/scripts/verify-npm-provenance.mjs
          node --check npm/moondesk.js
          node --check npm/install-binary.js
          node --check npm/update-manager.js
          node --check .github/scripts/verify-npm-package.mjs
          node --test npm/install-binary.test.js npm/update-manager.test.js npm/moondesk.test.js
          browser_pin="$(sed -n 's/.*CHROME_DEVTOOLS_PACKAGE_VERSION: &str = "\([^"]*\)".*/\1/p' src/browser_runtime.rs)"
          test -n "$browser_pin"
          npx -y "chrome-devtools-mcp@$browser_pin" --help >/dev/null
          node -e "const p=require('./package.json'); const s=p.scripts||{}; if (s.preinstall||s.install||s.postinstall) process.exit(1)"
          node -e "const p=require('./package.json'); if (Object.keys(p.bin||{}).length !== 1 || p.bin.moondesk !== 'npm/moondesk.js') throw new Error('MoonDesk must expose exactly one CLI bin'); for (const f of ['npm/moondesk.js','npm/install-binary.js','npm/update-manager.js','skills/browser/SKILL.md']) if (!p.files?.includes(f)) throw new Error('missing packaged runtime file: '+f)"
          node .github/scripts/verify-npm-package.mjs

  windows-rust:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    name: Windows Rust validation
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Run Clippy
        run: cargo +stable clippy --all-targets --locked -- -D warnings

      - name: Reject production panics and unchecked assumptions
        run: cargo +stable clippy --bin moondesk --locked -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::unreachable

      # Several command-job tests intentionally spawn PowerShell processes. GitHub-hosted
      # Windows runners can serialize process startup under load, so avoid making those
      # tests compete with each other for the same short readiness/timeout budgets.
      - name: Run tests
        run: cargo +stable test --locked -- --test-threads 1

      - name: Run Windows developer toolchain smoke
        run: cargo +stable test --locked windows_developer_toolchain_smoke_uses_normal_host_environment -- --ignored

      - name: Run Windows owned browser lifecycle smoke
        timeout-minutes: 10
        run: cargo +stable test --locked windows_owned_browser_runtime_is_lazy_and_recovers_after_child_exit -- --ignored --test-threads 1

      - name: Run Windows dispatched-timeout cancellation smoke
        timeout-minutes: 10
        run: cargo +stable test --locked windows_browser_timeout_cancels_dispatched_mutation -- --ignored --test-threads 1

      - name: Run Windows host browser session smoke
        timeout-minutes: 10
        run: cargo +stable test --locked windows_host_browser_cli_and_mcp_view_page_share_one_session -- --ignored --test-threads 1

      - name: Run Windows lazy browser vision smoke
        timeout-minutes: 10
        run: cargo +stable test --locked windows_view_page_returns_native_mcp_image_content -- --ignored --test-threads 1

  npm-runtime:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    name: npm runtime (Node ${{ matrix.node-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.19.0', '22.12.0', 24]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify supported npm runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check npm/moondesk.js
          node --check npm/install-binary.js
          node --check npm/update-manager.js
          node --test npm/install-binary.test.js npm/update-manager.test.js npm/moondesk.test.js
          browser_pin="$(sed -n 's/.*CHROME_DEVTOOLS_PACKAGE_VERSION: &str = "\([^"]*\)".*/\1/p' src/browser_runtime.rs)"
          test -n "$browser_pin"
          npx -y "chrome-devtools-mcp@$browser_pin" --help >/dev/null
