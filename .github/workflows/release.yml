name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to use (auto follows conventional commit messages)
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate and prepare release candidate
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      candidate_branch: ${{ steps.candidate.outputs.candidate_branch }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Validate merged source
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable fmt --check
          cargo +stable clippy --all-targets --locked -- -D warnings
          cargo +stable clippy --bin moondesk --locked -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::unreachable
          cargo +stable test --locked
          npm pack --dry-run --ignore-scripts

      - name: Plan and apply release version
        id: version
        env:
          REQUESTED_BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail
          bump="${REQUESTED_BUMP:-auto}"
          version="$(node .github/scripts/release-version.mjs --bump "$bump" --apply)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Preparing MoonDesk v$version"

      - name: Verify versioned source
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.version.outputs.version }}"
          test "$(node -p "require('./package.json').version")" = "$expected"
          grep -q "^version = \"$expected\"$" Cargo.toml
          cargo +stable check --locked
          npm pack --dry-run --ignore-scripts

      - name: Create release candidate commit
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          version="${{ steps.version.outputs.version }}"
          candidate_branch="release-candidate/v${version}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json Cargo.toml Cargo.lock
          git commit --allow-empty -m "chore(release): v${version}"
          candidate_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${candidate_branch}"

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: moondesk-linux-x64
            binary: target/release/moondesk
          - runner: ubuntu-22.04-arm
            asset: moondesk-linux-arm64
            binary: target/release/moondesk
          - runner: macos-15-intel
            asset: moondesk-darwin-x64
            binary: target/release/moondesk
          - runner: macos-15
            asset: moondesk-darwin-arm64
            binary: target/release/moondesk
          - runner: windows-2022
            asset: moondesk-win32-x64.exe
            binary: target/release/moondesk.exe

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.candidate_branch }}
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.candidate_sha }}"
          test "$(node -p "require('./package.json').version")" = "${{ needs.prepare.outputs.version }}"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build release binary
        run: cargo +stable build --release --locked

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          chmod 755 "dist/${{ matrix.asset }}"

      - name: Smoke-test binary and ClippyMoon export
        shell: bash
        run: |
          set -euo pipefail
          "./dist/${{ matrix.asset }}" clippymoon --help
          "./dist/${{ matrix.asset }}" clippymoon export \
            --seed 0000000000000042 \
            --out smoke-export
          test -s smoke-export/clippymoon.png
          test -s smoke-export/clippymoon.gif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Commit, tag, and create GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      refs_published: ${{ steps.publish_refs.outputs.refs_published }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -n "$(git config user.name)"
          test -n "$(git config user.email)"
          git var GIT_COMMITTER_IDENT >/dev/null

      - name: Publish tested release commit and tag
        id: publish_refs
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ needs.prepare.outputs.base_sha }}"
          candidate_sha="${{ needs.prepare.outputs.candidate_sha }}"
          candidate_branch="${{ needs.prepare.outputs.candidate_branch }}"
          tag="${{ needs.prepare.outputs.tag }}"

          git fetch origin --tags "refs/heads/main:refs/remotes/origin/main"
          current_main="$(git rev-parse origin/main)"

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged_sha="$(git rev-parse "$tag^{}")"
            if [ "$tagged_sha" != "$candidate_sha" ]; then
              echo "::error::$tag already exists but does not match the tested release candidate."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$candidate_sha" "$current_main"; then
              echo "::error::$tag matches the candidate, but that release commit is no longer an ancestor of main."
              exit 1
            fi
            echo "Release refs already contain the tested candidate; continuing recovery."
            echo "refs_published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$current_main" != "$base_sha" ]; then
            echo "::error::main advanced while this release was building. Refusing to overwrite newer work; the newer main run can release the combined changes."
            exit 1
          fi

          git fetch origin \
            "refs/heads/${candidate_branch}:refs/remotes/origin/${candidate_branch}"
          test "$(git rev-parse "origin/${candidate_branch}")" = "$candidate_sha"

          git tag -a "$tag" "$candidate_sha" -m "MoonDesk $tag"
          git push --atomic origin \
            "$candidate_sha:refs/heads/main" \
            "refs/tags/$tag"
          echo "refs_published=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Assemble release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -name 'moondesk-*' -exec cp {} release/ \;
          cd release
          test "$(find . -maxdepth 1 -type f -name 'moondesk-*' | wc -l)" -eq 5
          sha256sum moondesk-* > SHA256SUMS
          ls -la

      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; refreshing tested assets."
            gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "MoonDesk $tag" \
              --target "${{ needs.prepare.outputs.candidate_sha }}" \
              --generate-notes \
              --verify-tag
          fi

  publish-npm:
    name: Publish npm package
    needs:
      - prepare
      - release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use trusted-publishing capable npm CLI
        run: npm install --global npm@12.0.2

      - name: Verify release assets exist before npm publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "${{ needs.prepare.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null
          test "$(node -p "require('./package.json').version")" = "${{ needs.prepare.outputs.version }}"
          npm pack --dry-run --ignore-scripts

      - name: Publish to npm with Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          version="${{ needs.prepare.outputs.version }}"

          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "${package_name}@${version} is already published; nothing to do."
            exit 0
          fi

          if ! npm publish --access public; then
            echo "::error::npm Trusted Publishing failed. Verify the npm trusted publisher is GitHub Actions / Shattermoon / moondesk / release.yml and that this job retains id-token: write."
            exit 1
          fi

          for attempt in 1 2 3 4 5 6; do
            published_version="$(npm view "${package_name}@${version}" version 2>/dev/null || true)"
            if [ "$published_version" = "$version" ]; then
              echo "Confirmed ${package_name}@${version} on npm."
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "npm registry has not surfaced ${package_name}@${version} yet; retrying in 5 seconds..."
              sleep 5
            fi
          done

          echo "::error::npm publish returned successfully, but ${package_name}@${version} was not visible after 6 registry checks."
          exit 1

  cleanup-candidate:
    name: Clean release candidate branch
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      (
        needs.build.result != 'success' ||
        needs.release.result == 'success' ||
        (needs.release.result == 'failure' && needs.release.outputs.refs_published != 'true')
      )
    needs:
      - prepare
      - build
      - release
      - publish-npm
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Delete candidate branch
        shell: bash
        run: |
          git push origin --delete "${{ needs.prepare.outputs.candidate_branch }}" || true
