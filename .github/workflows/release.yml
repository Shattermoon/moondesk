name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Check formatting
        run: cargo +stable fmt --check

      - name: Run tests
        run: cargo +stable test --locked

      - name: Verify npm package contents
        run: npm pack --dry-run --ignore-scripts

  build:
    name: Build ${{ matrix.asset }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: moondesk-linux-x64
            binary: target/release/moondesk
          - runner: ubuntu-22.04-arm
            asset: moondesk-linux-arm64
            binary: target/release/moondesk
          - runner: macos-15-intel
            asset: moondesk-darwin-x64
            binary: target/release/moondesk
          - runner: macos-15
            asset: moondesk-darwin-arm64
            binary: target/release/moondesk
          - runner: windows-2022
            asset: moondesk-win32-x64.exe
            binary: target/release/moondesk.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build release binary
        run: cargo +stable build --release --locked

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          chmod 755 "dist/${{ matrix.asset }}"

      - name: Smoke-test binary and ClippyMoon export
        shell: bash
        run: |
          "./dist/${{ matrix.asset }}" clippymoon --help
          "./dist/${{ matrix.asset }}" clippymoon export \
            --seed 0000000000000042 \
            --out smoke-export
          test -s smoke-export/clippymoon.png
          test -s smoke-export/clippymoon.gif

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release assets and checksums
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f -name 'moondesk-*' -exec cp {} release/ \;
          cd release
          sha256sum moondesk-* > SHA256SUMS
          test "$(find . -maxdepth 1 -type f -name 'moondesk-*' | wc -l)" -eq 5
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "MoonDesk ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
