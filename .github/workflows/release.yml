name: Release

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Publish {0} ({1})', github.ref_name, inputs.dispatch_nonce)
      || format('Release {0}', github.sha) }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      operation:
        description: Recovery-only operation for an existing release tag
        required: true
        default: publish-tag
        type: choice
        options:
          - publish-tag
      dispatch_nonce:
        description: Internal correlation value used by the parent release run
        required: false
        type: string

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('release-publish-{0}', github.ref_name)
        || 'release-main' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Verify merged PR release source
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_release: ${{ steps.source.outputs.should_release }}
      pr_number: ${{ steps.source.outputs.pr_number }}
      bump: ${{ steps.source.outputs.bump }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove main push came from a merged pull request
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "should_release=false" >> "$GITHUB_OUTPUT"
          echo "pr_number=" >> "$GITHUB_OUTPUT"
          echo "bump=auto" >> "$GITHUB_OUTPUT"

          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          git fetch origin "refs/heads/main:refs/remotes/origin/main"
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "main already advanced to $current_main; this older push will not release."
            exit 0
          fi

          pulls_json="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"

          merged_matches="$(jq \
            --arg sha "$GITHUB_SHA" \
            '[.[] | select(
              .state == "closed" and
              .merged_at != null and
              .base.ref == "main" and
              .merge_commit_sha == $sha
            )]' \
            <<<"$pulls_json")"
          match_count="$(jq 'length' <<<"$merged_matches")"

          if [ "$match_count" -eq 0 ]; then
            echo "main push $GITHUB_SHA is not the merge SHA of a merged PR into main; release blocked."
            exit 0
          fi
          if [ "$match_count" -ne 1 ]; then
            echo "::error::Expected exactly one merged PR for $GITHUB_SHA, found $match_count."
            exit 1
          fi

          pr_number="$(jq -r '.[0].number' <<<"$merged_matches")"
          labels="$(jq -r '.[0].labels[].name' <<<"$merged_matches")"

          count=0
          bump="auto"
          for candidate in patch minor major; do
            if grep -Fxq "release:${candidate}" <<<"$labels"; then
              count=$((count + 1))
              bump="$candidate"
            fi
          done

          if [ "$count" -gt 1 ]; then
            echo "::error::PR #${pr_number} has conflicting release bump labels. Use at most one release bump label."
            exit 1
          fi

          echo "Verified merged PR #${pr_number} at $GITHUB_SHA; release bump: $bump"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"

  npm-preflight:
    name: Verify npm Trusted Publisher before mutation
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Exchange GitHub OIDC identity with npm
        run: node .github/scripts/npm-oidc-preflight.mjs moondesk

  repair-previous:
    name: Repair previous modern npm gap
    needs:
      - gate
      - npm-preflight
    if: needs.gate.outputs.should_release == 'true' && needs.npm-preflight.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Repair a previous tagged version before releasing new work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --tags
          current_version="$(node -p "require('./package.json').version")"
          current_tag="v${current_version}"

          if ! git show-ref --verify --quiet "refs/tags/${current_tag}"; then
            echo "No tag exists at the current manifest version; there is no previous release gap."
            exit 0
          fi

          tag_sha="$(git rev-parse "${current_tag}^{}")"
          if ! git merge-base --is-ancestor "$tag_sha" HEAD; then
            echo "::error::${current_tag} exists but is not an ancestor of current main."
            exit 1
          fi

          if ! git cat-file -e "${current_tag}:npm/install-binary.js" 2>/dev/null; then
            echo "${current_tag} predates lifecycle-script-free installation; leaving it GitHub-only."
            exit 0
          fi

          registry_file="$RUNNER_TEMP/npm-previous-version.json"
          registry_status="$(curl --silent --show-error \
            --output "$registry_file" \
            --write-out '%{http_code}' \
            "https://registry.npmjs.org/moondesk/${current_version}")"

          if [ "$registry_status" = "200" ]; then
            echo "moondesk@${current_version} already exists on npm."
            exit 0
          fi
          if [ "$registry_status" != "404" ]; then
            echo "::error::Could not determine npm state for moondesk@${current_version}; registry returned HTTP ${registry_status}."
            exit 1
          fi

          nonce="repair-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="Publish ${current_tag} (${nonce})"
          echo "Dispatching provenance-correct npm repair for ${current_tag}."
          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$current_tag" \
            -f operation=publish-tag \
            -f dispatch_nonce="$nonce"

          child_id=""
          for attempt in $(seq 1 30); do
            runs_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow Release \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,displayTitle)"
            child_id="$(jq -r --arg title "$title" '.[] | select(.displayTitle == $title) | .databaseId' <<<"$runs_json" | head -n 1)"
            if [ -n "$child_id" ] && [ "$child_id" != "null" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$child_id" ] || [ "$child_id" = "null" ]; then
            echo "::error::Timed out locating the dispatched repair run for ${current_tag}."
            exit 1
          fi

          echo "Waiting for repair run ${child_id}."
          gh run watch "$child_id" --repo "$GITHUB_REPOSITORY" --exit-status

  prepare:
    name: Validate and prepare release candidate
    needs:
      - gate
      - npm-preflight
      - repair-previous
    if: >-
      needs.gate.outputs.should_release == 'true' &&
      needs.npm-preflight.result == 'success' &&
      needs.repair-previous.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      candidate_branch: ${{ steps.candidate.outputs.candidate_branch }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      tag: ${{ steps.candidate.outputs.tag }}
      version: ${{ steps.candidate.outputs.version }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify merged-main source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin --tags "refs/heads/main:refs/remotes/origin/main"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Validate merged source
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable fmt --check
          cargo +stable clippy --all-targets --locked -- -D warnings
          cargo +stable clippy --bin moondesk --locked -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::unreachable
          cargo +stable test --locked
          node --check .github/scripts/npm-oidc-preflight.mjs
          node --check npm/moondesk.js
          node --check npm/install-binary.js
          node --check npm/update-manager.js
          node --check .github/scripts/verify-npm-package.mjs
          node --test npm/install-binary.test.js npm/update-manager.test.js npm/moondesk.test.js
          test "$(node -p "require('./package.json').repository.url")" = "git+https://github.com/Shattermoon/moondesk.git"
          node -e "const p=require('./package.json'); const s=p.scripts||{}; if (s.preinstall||s.install||s.postinstall) process.exit(1)"
          node -e "const p=require('./package.json'); for (const f of ['npm/moondesk.js','npm/install-binary.js','npm/update-manager.js']) if (!p.files?.includes(f)) throw new Error('missing packaged runtime file: '+f)"
          node .github/scripts/verify-npm-package.mjs

      - name: Plan and apply new release version
        id: version
        env:
          RELEASE_BUMP: ${{ needs.gate.outputs.bump }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node .github/scripts/release-version.mjs --bump "$RELEASE_BUMP" --apply)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Preparing MoonDesk v$version from merged PR #${{ needs.gate.outputs.pr_number }}"

      - name: Verify versioned source
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.version.outputs.version }}"
          test "$(node -p "require('./package.json').version")" = "$expected"
          grep -q "^version = \"$expected\"$" Cargo.toml
          cargo +stable check --locked
          node --test npm/install-binary.test.js npm/update-manager.test.js npm/moondesk.test.js
          node .github/scripts/verify-npm-package.mjs

      - name: Create tested release candidate
        id: candidate
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          candidate_branch="release-candidate/${TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json Cargo.toml Cargo.lock
          git commit --allow-empty -m "chore(release): ${TAG}"
          candidate_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${candidate_branch}"

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_branch=$candidate_branch" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.asset }}
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: moondesk-linux-x64
            binary: target/release/moondesk
          - runner: ubuntu-22.04-arm
            asset: moondesk-linux-arm64
            binary: target/release/moondesk
          - runner: macos-15-intel
            asset: moondesk-darwin-x64
            binary: target/release/moondesk
          - runner: macos-15
            asset: moondesk-darwin-arm64
            binary: target/release/moondesk
          - runner: windows-2022
            asset: moondesk-win32-x64.exe
            binary: target/release/moondesk.exe

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.candidate_branch }}
          persist-credentials: false

      - name: Verify candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.candidate_sha }}"
          test "$(node -p "require('./package.json').version")" = "${{ needs.prepare.outputs.version }}"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build release binary
        run: cargo +stable build --release --locked

      - name: Stage binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          chmod 755 "dist/${{ matrix.asset }}"

      - name: Smoke-test binary and ClippyMoon export
        shell: bash
        run: |
          set -euo pipefail
          expected_version="$(node -p "require('./package.json').version")"
          test "$("./dist/${{ matrix.asset }}" --version)" = "$expected_version"
          test "$("./dist/${{ matrix.asset }}" -V)" = "$expected_version"
          "./dist/${{ matrix.asset }}" clippymoon --help
          "./dist/${{ matrix.asset }}" clippymoon export \
            --seed 0000000000000042 \
            --out smoke-export
          test -s smoke-export/clippymoon.png
          test -s smoke-export/clippymoon.gif

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Commit, tag, create GitHub Release, and publish npm
    needs:
      - prepare
      - build
    if: needs.prepare.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: write
    outputs:
      refs_published: ${{ steps.publish_refs.outputs.refs_published }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -n "$(git config user.name)"
          test -n "$(git config user.email)"
          git var GIT_COMMITTER_IDENT >/dev/null

      - name: Publish or verify tested release refs
        id: publish_refs
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${{ needs.prepare.outputs.base_sha }}"
          candidate_sha="${{ needs.prepare.outputs.candidate_sha }}"
          candidate_branch="${{ needs.prepare.outputs.candidate_branch }}"
          tag="${{ needs.prepare.outputs.tag }}"

          git fetch origin --tags "refs/heads/main:refs/remotes/origin/main"
          current_main="$(git rev-parse origin/main)"

          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tagged_sha="$(git rev-parse "$tag^{}")"
            if [ "$tagged_sha" != "$candidate_sha" ]; then
              echo "::error::$tag already exists but does not match the tested release candidate."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$candidate_sha" "$current_main"; then
              echo "::error::$tag matches the candidate, but that release commit is no longer an ancestor of main."
              exit 1
            fi
            echo "Release refs already contain the tested candidate; continuing idempotent recovery."
            echo "refs_published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$current_main" != "$base_sha" ]; then
            echo "::error::main advanced while this release was building. Refusing to overwrite newer work."
            exit 1
          fi

          git fetch origin \
            "refs/heads/${candidate_branch}:refs/remotes/origin/${candidate_branch}"
          test "$(git rev-parse "origin/${candidate_branch}")" = "$candidate_sha"

          git tag -a "$tag" "$candidate_sha" -m "MoonDesk $tag"
          git push --atomic origin \
            "$candidate_sha:refs/heads/main" \
            "refs/tags/$tag"
          echo "refs_published=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Assemble release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -name 'moondesk-*' -exec cp {} release/ \;
          cd release
          test "$(find . -maxdepth 1 -type f -name 'moondesk-*' | wc -l)" -eq 5
          sha256sum moondesk-* > SHA256SUMS
          ls -la

      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; refreshing tested assets."
            gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "MoonDesk $tag" \
              --target "${{ needs.prepare.outputs.candidate_sha }}" \
              --generate-notes \
              --verify-tag
          fi

          actual_assets="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          expected_assets="$(printf '%s\n' \
            SHA256SUMS \
            moondesk-darwin-arm64 \
            moondesk-darwin-x64 \
            moondesk-linux-arm64 \
            moondesk-linux-x64 \
            moondesk-win32-x64.exe | sort)"
          test "$actual_assets" = "$expected_assets"

          verify_dir="$RUNNER_TEMP/release-download"
          rm -rf "$verify_dir"
          mkdir -p "$verify_dir"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          cd "$verify_dir"
          sha256sum --check SHA256SUMS

      - name: Publish npm from the immutable tag context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          nonce="release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="Publish ${tag} (${nonce})"

          gh workflow run release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$tag" \
            -f operation=publish-tag \
            -f dispatch_nonce="$nonce"

          child_id=""
          for attempt in $(seq 1 30); do
            runs_json="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow Release \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,displayTitle)"
            child_id="$(jq -r --arg title "$title" '.[] | select(.displayTitle == $title) | .databaseId' <<<"$runs_json" | head -n 1)"
            if [ -n "$child_id" ] && [ "$child_id" != "null" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$child_id" ] || [ "$child_id" = "null" ]; then
            echo "::error::Timed out locating the tag publication run for ${tag}."
            exit 1
          fi

          echo "Waiting for npm publication run ${child_id}."
          gh run watch "$child_id" --repo "$GITHUB_REPOSITORY" --exit-status

  publish-tag:
    name: Publish verified tag to npm
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'publish-tag'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v${version}"
          grep -q "^version = \"${version}\"$" Cargo.toml
          test -f npm/install-binary.js
          test -f npm/update-manager.js
          test ! -e npm/postinstall.js
          node -e "const p=require('./package.json'); const s=p.scripts||{}; if (s.preinstall||s.install||s.postinstall) process.exit(1)"
          node -e "const p=require('./package.json'); for (const f of ['npm/moondesk.js','npm/install-binary.js','npm/update-manager.js']) if (!p.files?.includes(f)) throw new Error('missing packaged runtime file: '+f)"
          test "$(node -p "require('./package.json').repository.url")" = "git+https://github.com/Shattermoon/moondesk.git"

          git fetch origin --tags "refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-parse "${GITHUB_REF_NAME}^{}")" = "$GITHUB_SHA"

          release_target="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
          test "$release_target" = "$GITHUB_SHA"

          actual_assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          expected_assets="$(printf '%s\n' \
            SHA256SUMS \
            moondesk-darwin-arm64 \
            moondesk-darwin-x64 \
            moondesk-linux-arm64 \
            moondesk-linux-x64 \
            moondesk-win32-x64.exe | sort)"
          test "$actual_assets" = "$expected_assets"

          verify_dir="$RUNNER_TEMP/release-assets"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          cd "$verify_dir"
          sha256sum --check SHA256SUMS

      - name: Verify npm Trusted Publisher for this tag context
        run: node .github/scripts/npm-oidc-preflight.mjs moondesk

      - name: Use pinned Trusted-Publishing capable npm CLI
        run: npm install --global npm@12.0.2

      - name: Configure clean npm OIDC environment
        shell: bash
        run: |
          set -euo pipefail
          npmrc="$RUNNER_TEMP/moondesk-oidc.npmrc"
          printf '%s\n' \
            'registry=https://registry.npmjs.org/' \
            'provenance=true' > "$npmrc"
          echo "NPM_CONFIG_USERCONFIG=$npmrc" >> "$GITHUB_ENV"
          test -z "${NPM_TOKEN:-}"
          test -z "${NODE_AUTH_TOKEN:-}"
          if grep -Eqi '(_auth|authToken|token=)' "$npmrc"; then
            echo "::error::OIDC npm config unexpectedly contains token authentication."
            exit 1
          fi
          npm --version
          node --version

      - name: Publish immutable package with provenance
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          node .github/scripts/verify-npm-package.mjs

          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "${package_name}@${version} is already published; verifying it instead of republishing."
          else
            npm publish --access public --provenance
          fi

          for attempt in $(seq 1 12); do
            published_version="$(npm view "${package_name}@${version}" version 2>/dev/null || true)"
            if [ "$published_version" = "$version" ]; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::${package_name}@${version} was not visible after one minute."
              exit 1
            fi
            sleep 5
          done

      - name: Authenticate npm signatures and provenance bundle
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          audit_dir="$RUNNER_TEMP/npm-signature-audit"
          rm -rf "$audit_dir"
          mkdir -p "$audit_dir"
          printf '%s\n' '{"name":"moondesk-release-verification","private":true}' > "$audit_dir/package.json"
          cd "$audit_dir"
          npm install --ignore-scripts --no-audit --no-fund "${package_name}@${version}"
          for attempt in $(seq 1 24); do
            if audit_output="$(npm audit signatures 2>&1)"; then
              printf '%s\n' "$audit_output"
              break
            else
              audit_status=$?
            fi
            printf '%s\n' "$audit_output"

            if ! grep -Fq '/-/npm/v1/attestations/' <<<"$audit_output" || \
               ! grep -Eq '404 Not Found|npm error code E404' <<<"$audit_output"; then
              exit "$audit_status"
            fi

            if [ "$attempt" -eq 24 ]; then
              echo "::error::npm provenance attestation for ${package_name}@${version} was not visible after two minutes."
              exit "$audit_status"
            fi

            echo "npm provenance attestation is not visible yet; retrying signature audit in 5 seconds (${attempt}/24)."
            sleep 5
          done

      - name: Verify authenticated npm provenance points to this exact tag commit
        shell: bash
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          node .github/scripts/verify-npm-provenance.mjs \
            "$package_name" \
            "$version" \
            "$GITHUB_REF" \
            "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY"

      - name: Verify fresh npm install and first-run binary bootstrap
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          prefix="$RUNNER_TEMP/moondesk-e2e-prefix"
          cache="$RUNNER_TEMP/moondesk-e2e-cache"
          export MOONDESK_BINARY_CACHE_DIR="$cache"

          npm install --global --prefix "$prefix" --ignore-scripts "moondesk@${version}"
          test ! -e "$cache/moondesk"

          test "$("$prefix/bin/moondesk" --version)" = "$version"
          test "$("$prefix/bin/moondesk" -V)" = "$version"
          "$prefix/bin/moondesk" clippymoon --help
          "$prefix/bin/moondesk" clippymoon export \
            --seed 0000000000000042 \
            --out "$RUNNER_TEMP/npm-e2e-export"

          test -s "$RUNNER_TEMP/npm-e2e-export/clippymoon.png"
          test -s "$RUNNER_TEMP/npm-e2e-export/clippymoon.gif"
          test -s "$cache/moondesk"

          checksums="$RUNNER_TEMP/release-assets/SHA256SUMS"
          expected_sha="$(awk '$2 == "moondesk-linux-x64" {print $1}' "$checksums")"
          actual_sha="$(sha256sum "$cache/moondesk" | awk '{print $1}')"
          test -n "$expected_sha"
          test "$actual_sha" = "$expected_sha"

  cleanup-candidate:
    name: Clean release candidate branch
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.candidate_branch != ''
    needs:
      - prepare
      - build
      - release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Delete candidate branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete "${{ needs.prepare.outputs.candidate_branch }}" || true
