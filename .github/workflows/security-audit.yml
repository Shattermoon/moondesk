name: Security audit

# Dependency PRs are checked immediately, while the scheduled run catches newly
# published advisories even when Cargo.toml and Cargo.lock have not changed.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/security-audit.yml
  schedule:
    - cron: "23 3 * * *"

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rustsec:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: RustSec
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # GitHub's ubuntu-22.04 image includes cargo-audit. Plain `cargo audit`
      # reports informational advisories without failing, but exits non-zero for
      # security vulnerabilities. Printing the version keeps the runner-provided
      # scanner version visible in every audit log.
      - name: Audit Rust dependencies
        run: |
          cargo audit --version
          cargo audit
