name: Security audit

# Dependency PRs are checked immediately, while the scheduled run catches newly
# published advisories even when Cargo.toml and Cargo.lock have not changed.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/security-audit.yml
  schedule:
    - cron: "23 3 * * *"

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rustsec:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: RustSec
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-audit --version 0.22.2 --locked

      # Audit only the checked-in lockfile from an isolated directory. A pull
      # request can modify `.cargo/audit.toml`, so running inside the checkout
      # would let PR-controlled configuration weaken or suppress the audit.
      - name: Audit Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/Cargo.lock"
          audit_dir="${RUNNER_TEMP}/moondesk-rustsec-audit"
          rm -rf "$audit_dir"
          mkdir -p "$audit_dir/cargo-home"
          cp "$GITHUB_WORKSPACE/Cargo.lock" "$audit_dir/Cargo.lock"
          export CARGO_HOME="$audit_dir/cargo-home"
          cd "$audit_dir"
          cargo +stable audit --version
          cargo +stable audit
